---
name: Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      new_version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for version tag
        id: check
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "Target version: $VERSION"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists. Skipping release steps."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v$VERSION does not exist. Triggering release pipeline."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - name: Format check
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Lint (Windows)
        run: cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-26, windows-2025 ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked

  build:
    name: Build (${{ matrix.artifact }})
    needs: [ version, validate, test ]
    if: github.ref == 'refs/heads/main' && needs.version.outputs.changed == 'true'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
            artifact: darwin-aarch64
          - os: macos-26
            target: x86_64-apple-darwin
            artifact: darwin-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: linux-aarch64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact: linux-x86_64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: windows-aarch64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION=${{ needs.version.outputs.new_version }}
          ARTIFACT=delish-$VERSION-${{ matrix.artifact }}
          mkdir -p dist/$ARTIFACT
          cp target/${{ matrix.target }}/release/delish dist/$ARTIFACT/
          cp target/${{ matrix.target }}/release/delishd dist/$ARTIFACT/
          cp LICENSE dist/$ARTIFACT/
          tar -czf dist/$ARTIFACT.tar.gz -C dist $ARTIFACT
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ needs.version.outputs.new_version }}"
          $ARTIFACT = "delish-$VERSION-${{ matrix.artifact }}"
          New-Item -ItemType Directory -Path "dist/$ARTIFACT" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/delish.exe" "dist/$ARTIFACT/"
          Copy-Item "target/${{ matrix.target }}/release/delishd.exe" "dist/$ARTIFACT/"
          Copy-Item "LICENSE" "dist/$ARTIFACT/"
          Compress-Archive -Path "dist/$ARTIFACT" -DestinationPath "dist/$ARTIFACT.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: delish-${{ needs.version.outputs.new_version }}-${{ matrix.artifact }}
          path: dist/delish-${{ needs.version.outputs.new_version }}-${{ matrix.artifact }}.*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [ version, build ]
    if: github.ref == 'refs/heads/main' && needs.version.outputs.changed == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_tag_gpgsign: true
      - name: Generate and sign checksums
        working-directory: dist
        run: |
          LC_ALL=C sha256sum -- * > SHA256SUMS
          gpg --batch --yes \
            --local-user '${{ steps.import_gpg.outputs.fingerprint }}' \
            --output SHA256SUMS.sig \
            --detach-sign SHA256SUMS
          gpg --batch --verify SHA256SUMS.sig SHA256SUMS
      - name: Create signed tag
        run: |
          git tag -s "v${{ needs.version.outputs.new_version }}" -m "Release v${{ needs.version.outputs.new_version }}"
          git push origin "v${{ needs.version.outputs.new_version }}"
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ needs.version.outputs.new_version }}
          # a version with a pre-release part (0.1.0-alpha.1) is published as a prerelease
          PRERELEASE=()
          if [[ $VERSION == *-* ]]; then
            PRERELEASE=(--prerelease)
          fi
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            "${PRERELEASE[@]}" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/SHA256SUMS.sig
