[package]
name = "delish"
version = "0.6.0"
edition = "2024"
license = "MIT"

[lib]

[[bin]]
name = "delish"
path = "src/bin/delish.rs"

[[bin]]
name = "delishd"
path = "src/bin/delishd.rs"

[dependencies]
# the noise protocol, with only what delish's pattern uses: x25519, chacha20-poly1305, blake2s, and the os's randomness
snow = { version = "0.10.0", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"] }
# already snow's, for a private key's public half
curve25519-dalek = { version = "4.1.3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2.1"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
