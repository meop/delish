[package]
name = "deskpty"
version = "0.1.0-alpha.5"
edition = "2024"
license = "MIT"

[lib]

[[bin]]
name = "deskpty"
path = "src/bin/deskpty.rs"

[[bin]]
name = "deskptyd"
path = "src/bin/deskptyd.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2.1"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
